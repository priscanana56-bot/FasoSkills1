name: app
description: "FasoSkills - Plateforme de mise en relation entre artisans et clients"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.0
  get_it: ^8.0.3
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  equatable: ^2.0.7
  intl: ^0.20.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/image/splashPhoto.png
    - assets/image/userphoto.png
    - assets/image/artisanphoto.png
